[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "epiplot"
version = "0.1.0"
description = "A data plotting and geospatial visualization library for epidemiological research."
readme = "README.md"
requires-python = ">=3.13"
license = "BSD-3-Clause"
license-files = ["LICENSE"]

authors = [
    { name = "Lee Hart", email = "leehart3000@gmail.com" }
]

dependencies = []

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/leehart3000/epiplot"
Repository = "https://github.com/leehart3000/epiplot"
Issues = "https://github.com/leehart3000/epiplot/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-64", "linux-64", "osx-arm64", "win-64"]

[tool.pixi.pypi-dependencies]
epiplot = { path = ".", editable = true }

[tool.pixi.dependencies]
pip = "*"
ruff = ">=0.16.9,<0.17"
mypy = ">=2.3.1,<3"
pytest = ">=9.1.1,<10"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "NPY"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]

[tool.pixi.tasks]
format = "ruff format ."
lint = "ruff check ."
format-check = "ruff format --check ."
typecheck = "mypy"
test = "pytest"
check = { depends-on = ["lint", "format-check", "typecheck", "test"] }

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.environments]
default = ["py313"]
py314 = ["py314"]
