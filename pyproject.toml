[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "epiplot"
version = "0.5.0"
description = "A data plotting and geospatial visualization library for epidemiological research."
readme = "README.md"
requires-python = ">=3.13"
license = "BSD-3-Clause"
license-files = ["LICENSE"]

authors = [
    { name = "Lee Hart", email = "leehart3000@gmail.com" }
]

dependencies = [
    "matplotlib>=3.10",
    "numpy>=2.1",
    "pandas>=2.2",
    "scipy>=1.16",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
maps = ["geopandas>=1.1", "shapely>=2.1"]

[project.urls]
Homepage = "https://github.com/leehart3000/epiplot"
Repository = "https://github.com/leehart3000/epiplot"
Issues = "https://github.com/leehart3000/epiplot/issues"
Documentation = "https://leehart3000.github.io/epiplot/"

[tool.setuptools.package-data]
epiplot = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-64", "linux-64", "osx-arm64", "win-64"]

[tool.pixi.pypi-dependencies]
epiplot = { path = ".", editable = true }

[tool.pixi.dependencies]
pip = "*"
ruff = ">=0.16.9,<0.17"
mypy = ">=2.3.1,<3"
pytest = ">=9.1.1,<10"
matplotlib-base = ">=3.10"
numpy = ">=2.1"
pandas = ">=2.2"
pandas-stubs = ">=3.0.5.260914,<4"
scipy = ">=1.16"
scipy-stubs = ">=1.16.3.3,<2"
geopandas = ">=1.1"
shapely = ">=2.1"
pre-commit = "*"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "NPY"]

[tool.mypy]
strict = true
files = ["src", "tests"]
# matplotlib.dates has no type hints yet, so allow calling it.
untyped_calls_exclude = ["matplotlib.dates"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]

[tool.pixi.tasks]
format = "ruff format ."
lint = "ruff check ."
format-check = "ruff format --check ."
typecheck = "mypy"
test = "pytest"
check = { depends-on = ["lint", "format-check", "typecheck", "test"] }
fix = "ruff check --fix . && ruff format ."

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.environments]
default = ["py313"]
py314 = ["py314"]
colab = ["colab"]
docs = ["py313", "docs"]

[tool.pixi.feature.colab.dependencies]
python = "3.13.*"
numpy = "2.1.*"
pandas = "2.2.*"
matplotlib-base = "3.10.*"
scipy = "1.16.*"
geopandas = "1.1.*"
shapely = "2.1.*"

[tool.pixi.feature.docs.dependencies]
sphinx = "*"
myst-parser = "*"
pydata-sphinx-theme = "*"
sphinxcontrib-mermaid = "*"
sphinx-design = "*"
myst-nb = "*"
ipykernel = "*"

[tool.pixi.feature.docs.tasks]
docs = "sphinx-build -W --keep-going -b html docs docs/_build/html"
